name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test
        env:
          DSH_HOST_NODE_MODULES: ${{ github.workspace }}/.tmp-build/host/node_modules
        run: |
          npm ci --legacy-peer-deps
          npm install --prefix .tmp-build/host --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.1.0-rc.8
          npm test

      - name: Build release archive
        shell: bash
        run: |
          mkdir dist
          npm pack --pack-destination dist
          mv dist/*.tgz dist/dsh-pentest.tar.gz
          tar -tf dist/dsh-pentest.tar.gz | grep -Fx 'package/scripts/repair-composer.mjs'
          tar -tf dist/dsh-pentest.tar.gz | grep -Fx 'package/scripts/burp-mcp.mjs'
          tar -tf dist/dsh-pentest.tar.gz | grep -Fx 'package/scripts/repair-preset.mjs'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
